name: Publish OCB image (date-stamped pin)

# ---------------------------------------------------------------------------
# Demo-stack publish for the OCB-built collector image. The full release
# workflow (release.yml) gates on `v*` semver tags and produces the canonical
# multi-arch image + signed binaries + SBOM. This workflow is the lighter
# date-stamped variant the demo / workload cluster pins to:
#   ghcr.io/henrikrexed/otelcol-gatewayapi:YYYY-MM-DD
#
# Triggers
#   - push tags matching `ocb-*` (e.g. `ocb-2026-04-21`) — image tag is the
#     suffix after `ocb-`.
#   - workflow_dispatch with input `tag` — manual reruns / hotfixes without
#     a tag push.
#
# Image name mirrors release.yml so cluster CRs can pin to either alias.
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      - 'ocb-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. 2026-04-21). Required for manual runs.'
        type: string
        required: true

# Workflow-level floor only. Elevated scopes are granted per job so the
# `binaries` job (which `go install`s OCB + runs third-party build tooling)
# never sees packages:write / id-token / security-events:write.
permissions:
  contents: read

env:
  IMAGE_REGISTRY: ghcr.io/henrikrexed
  IMAGE_NAME: gatewayapiprocessor-collector
  ALIAS_IMAGE_NAME: otelcol-gatewayapi

concurrency:
  group: publish-ocb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: Binary linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5  # pinned to v5 until actions/checkout#2299 closes (ISI-846)

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: gatewayapiprocessor/go.sum

      - name: Derive OCB version from builder-config.yaml
        id: ocb
        run: |
          OCB_VERSION=$(grep -E '^\s*version:' builder-config.yaml | head -1 | awk '{print $2}' | cut -d- -f1)
          echo "version=${OCB_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using OCB v${OCB_VERSION}"

      - name: Install OCB
        run: go install go.opentelemetry.io/collector/cmd/builder@v${{ steps.ocb.outputs.version }}

      - name: Cross-compile collector (linux/${{ matrix.goarch }})
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOFLAGS: '-trimpath'
        run: |
          builder --config=builder-config.yaml
          mkdir -p dist
          cp _build/otelcol-gatewayapi dist/otelcol-gatewayapi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-linux-${{ matrix.goarch }}
          path: dist/otelcol-gatewayapi
          retention-days: 7

  image:
    name: Multi-arch image (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    needs: binaries
    permissions:
      contents: read
      packages: write    # push image to GHCR
      id-token: write    # cosign keyless (OIDC) signing
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5  # pinned to v5 until actions/checkout#2299 closes (ISI-846)

      - name: Derive image tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VAL="${{ github.event.inputs.tag }}"
          else
            # refs/tags/ocb-YYYY-MM-DD → YYYY-MM-DD
            VAL="${GITHUB_REF_NAME#ocb-}"
          fi
          if [ -z "$VAL" ] || [ "$VAL" = "${GITHUB_REF_NAME}" ]; then
            echo "could not derive image tag from event=${{ github.event_name }} ref=${GITHUB_REF_NAME} input=${{ github.event.inputs.tag || '' }}" >&2
            exit 1
          fi
          echo "value=${VAL}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${VAL}"

      - name: Download linux binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-linux-*
          path: tmp-binaries

      - name: Stage binaries for Dockerfile COPY
        run: |
          set -euxo pipefail
          mkdir -p dist/linux
          for dir in tmp-binaries/binary-linux-*; do
            [ -d "$dir" ] || continue
            arch="${dir##*binary-linux-}"   # e.g. amd64, arm64
            mkdir -p "dist/linux/${arch}"
            cp "$dir/otelcol-gatewayapi" "dist/linux/${arch}/otelcol-gatewayapi"
            chmod +x "dist/linux/${arch}/otelcol-gatewayapi"
          done
          ls -lhR dist/linux

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.ALIAS_IMAGE_NAME }}:${{ steps.tag.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/henrikrexed/gatewayapiprocessor
            org.opencontainers.image.description=OTel Collector with gatewayapiprocessor (date-stamped demo pin)
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=IsItObservable
            org.opencontainers.image.version=${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images (keyless, OIDC)
        env:
          COSIGN_EXPERIMENTAL: '1'
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Sign both the canonical and alias image refs by digest so every
          # name a cluster CR might pin resolves to a signed artifact. Mirrors
          # release.yml's signing step for the semver path.
          for name in \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}" \
            "${{ env.IMAGE_REGISTRY }}/${{ env.ALIAS_IMAGE_NAME }}"; do
            echo "Signing ${name}@${DIGEST}"
            cosign sign --yes "${name}@${DIGEST}"
          done

      - name: Print published image refs + record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          echo "Published:"
          echo "  ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          echo "  ${{ env.IMAGE_REGISTRY }}/${{ env.ALIAS_IMAGE_NAME }}:${TAG}"
          echo "Digest: ${DIGEST}"
          # Emit the exact, independently-verifiable pin line to paste under the
          # "Image tags" section of VERSIONS.md (see that file's digest note).
          {
            echo "### Published digest (record in VERSIONS.md)"
            echo ""
            echo '```'
            # Emit BOTH the canonical name and the alias: deploy/ manifests pin
            # the alias (otelcol-gatewayapi), and cosign verify has to name the
            # repo actually pulled. Same digest for both (one manifest push).
            for name in \
              "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}" \
              "${{ env.IMAGE_REGISTRY }}/${{ env.ALIAS_IMAGE_NAME }}"; do
              echo "- \`${TAG}\` -> \`${name}@${DIGEST}\`"
            done
            echo '```'
            echo ""
            echo "Verify signature:"
            echo '```'
            echo "cosign verify ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST} \\"
            echo "  --certificate-identity-regexp='https://github.com/henrikrexed/gatewayapiprocessor/.*' \\"
            echo "  --certificate-oidc-issuer=https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Image vulnerability scan (parity with release.yml). SARIF -> Security tab +
  # build artifact. Scans the exact digest the image job just pushed.
  # ---------------------------------------------------------------------------
  scan:
    name: Trivy scan
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
    steps:
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.image.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true   # match ci.yml trivy-fs: drop unfixable distroless-base noise
          # Non-blocking (exit 0) ON PURPOSE: the scan runs AFTER the image is
          # pushed + signed, so a non-zero code here cannot gate a tag that is
          # already live, and this date-stamped tag is intentionally mutable
          # (re-published in place on component fixes). The SARIF is the signal;
          # a CRITICAL/HIGH finding is triaged via the Security tab, not by
          # breaking the demo publish. The blocking source-level gate is
          # govulncheck in ci.yml + the semver release.yml path.
          exit-code: '0'

      - name: Upload Trivy SARIF to code-scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-ocb-date

      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 30

  # ---------------------------------------------------------------------------
  # CycloneDX image SBOM (parity with release.yml). Generated from the pushed
  # digest so the SBOM describes exactly what was published.
  # ---------------------------------------------------------------------------
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read   # public image pull needs no registry creds (release.yml parity)
    steps:
      - name: Generate image SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.image.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.image.cyclonedx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.image.cyclonedx.json
          retention-days: 90
